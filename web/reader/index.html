<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>local-tts reader</title>
    <link rel="stylesheet" href="/assets/pdfjs/web/pdf_viewer.css">
    <link rel="stylesheet" href="/reader/reader.css">
  </head>
  <body>
    <header id="toolbar">
      <strong id="documentName">Local PDF reader</strong>
      <span class="divider"></span>
      <button id="previousPage" type="button" title="Previous page">Previous</button>
      <label>Page <input id="pageNumber" type="number" min="1" value="1"></label>
      <span id="pageCount">of —</span>
      <button id="nextPage" type="button" title="Next page">Next</button>
      <span class="divider"></span>
      <div id="zoomControls" aria-label="PDF zoom controls">
        <button id="zoomOut" type="button" title="Zoom out">−</button>
        <label>Zoom
          <select id="zoomSelect" title="PDF zoom level">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="3">300%</option>
            <option value="4">400%</option>
            <option value="5">500%</option>
            <option value="6">600%</option>
            <option value="page-width">Page width</option>
            <option value="page-fit">Page fit</option>
          </select>
        </label>
        <button id="zoomIn" type="button" title="Zoom in">+</button>
      </div>
      <span class="divider"></span>
      <label id="themeControl">Theme
        <select id="themeSelect" title="Reader theme">
          <option value="kuro-nezumi">Kuro Nezumi</option>
          <option value="default">PDF.js default</option>
          <option value="custom">Custom stylesheet</option>
        </select>
      </label>
      <span class="divider"></span>
      <span id="localTtsControls"></span>
      <span id="localTtsStatus" aria-live="polite"></span>
      <progress id="localTtsProgress" hidden></progress>
    </header>
    <section id="pdfLoading" aria-live="polite">
      <span id="pdfLoadingLabel">Opening local PDF…</span>
      <progress id="pdfLoadingProgress"></progress>
    </section>
    <div id="viewerContainer" tabindex="0">
      <div id="viewer" class="pdfViewer"></div>
    </div>
    <script src="/local-tts/pdfjs-local-tts.js"></script>
    <script type="module" src="/reader/reader.mjs"></script>
  </body>
</html>
