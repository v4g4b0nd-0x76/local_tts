[project]
name = "local-tts"
version = "0.1.0"
description = "Local PDF-to-speech study tool for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Local use" }]
dependencies = [
  "kokoro-mlx==0.1.2",
  "numpy>=2.0",
  "pypdf>=5.0",
  "soundfile>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fpdf2>=2.8"]

[project.scripts]
local-tts = "local_tts.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

